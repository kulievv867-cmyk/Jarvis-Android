plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devin.jarvis'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.devin.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Bake the OpenAI key into BuildConfig at build time, if available in env.
        // Personal-use only — do not share the APK without rotating the key.
        def openaiKey = System.getenv("OPENAI_API_KEY") ?: ""
        buildConfigField "String", "OPENAI_API_KEY_DEFAULT", "\"${openaiKey}\""

        // Real Android phones are arm64; armeabi-v7a covers older 32-bit ARM
        // devices. Excluding x86/mips trims ~30 MB off the APK.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-std=c++17', '-fexceptions', '-frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Vosk model files are already mostly compressed binary — telling AAPT not
    // to recompress them keeps build time low and lets StorageService.unpack
    // stream them directly out of the APK without re-decompression issues.
    androidResources {
        // Vosk model files are mostly already-compressed binary; tell AAPT not
        // to recompress them so install-time extraction stays fast and direct.
        // .bin = whisper.cpp ggml model files (also already-quantized).
        noCompress 'mdl', 'fst', 'tcsr', 'final', 'fstm', 'tree',
                'ie', 'mat', 'dubm', 'int', 'conf', 'stats', 'bin'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    // Offline speech recognition (replaces Android SpeechRecognizer)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // ExoPlayer (Media3) for in-app music streaming.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // NewPipeExtractor — searches YouTube and extracts direct audio stream
    // URLs without an API key, so Jarvis can play tracks itself.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.1'
}
